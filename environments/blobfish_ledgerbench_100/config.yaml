blobfish_ledgerbench_100:
  resources_servers:
    blobfish_enterprise_ops:
      entrypoint: app.py
      domain: agent
      verified: false
      description: >-
        LedgerBench-100: 100 stateful enterprise-operations tasks over 66 tools; SQLite-backed multi-system world (ERP, books, docs, email, filings, sheets) with a call trace; graded by a deterministic state-and-trace verifier with no LLM judge.
      value: >-
        Improve long-horizon, multi-system tool use in back-office work: investigate before writing, keep unrelated records unchanged, read writes back, and submit exact answers.
      # Task packages come from the Harbor Hub (one command, no source repos):
      #   harbor datasets download blobfishai/ledgerbench-100 -o data/suites/ledgerbench-100
      # They are executable code run in-process; suite_manifest pins every package to the reviewed
      # SHA-256 and the server refuses anything else.
      suite_dir: ${oc.env:BLOBFISH_LEDGERBENCH_100_DIR,data/suites/ledgerbench-100/ledgerbench-100}
      suite_manifest: environments/blobfish_ledgerbench_100/data/suite_manifest.json
      # fraction (criterion fraction), strict (all criteria), or gated (fraction x earned share of the
      # suite's outcome families: a wrong final write then loses most of the reward). Use gated for RL.
      reward_mode: fraction
      max_open_episodes: 4096
      episode_ttl_seconds: 7200
blobfish_ledgerbench_100_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # Longest oracle plan in this suite: 144 tool calls; the cap ends runaway loops (simple_agent has none by default).
      max_steps: 288
      resources_server:
        type: resources_servers
        name: blobfish_ledgerbench_100
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: environments/blobfish_ledgerbench_100/data/train.jsonl
        source:
          type: huggingface
          repo_id: johnnychien/blobfish-nemo-gym-enterprise-ops
          artifact_fpath: ledgerbench_100/train.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: validation
        type: validation
        jsonl_fpath: environments/blobfish_ledgerbench_100/data/validation.jsonl
        source:
          type: huggingface
          repo_id: johnnychien/blobfish-nemo-gym-enterprise-ops
          artifact_fpath: ledgerbench_100/validation.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: example
        type: example
        jsonl_fpath: environments/blobfish_ledgerbench_100/data/example.jsonl
        license: Creative Commons Attribution 4.0 International
